name: Android test APK

on:
  push:
    paths:
      - "apps/mobile/**"
      - "packages/shared/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write # publish the APK as a pre-release

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Optional repository variables (Settings > Secrets and variables > Actions > Variables).
    # Both are public values; leave them unset for a demo-mode build.
    env:
      WARDEN_API_URL: ${{ vars.WARDEN_API_URL }}
      WARDEN_BROADCAST_PUBLIC_KEY: ${{ vars.WARDEN_BROADCAST_PUBLIC_KEY }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      - run: pnpm install --frozen-lockfile

      - name: Check the app's JavaScript
        working-directory: apps/mobile
        run: pnpm typecheck && pnpm test

      - name: Generate the native Android project
        working-directory: apps/mobile
        env:
          CI: "1"
          WARDEN_VERSION_CODE: ${{ github.run_number }}
        run: npx expo prebuild --platform android --no-install

      - name: Build the release APK
        working-directory: apps/mobile/android
        env:
          # Real phones only (no emulator ABIs) keeps the download small.
          ORG_GRADLE_PROJECT_reactNativeArchitectures: armeabi-v7a,arm64-v8a
        run: ./gradlew assembleRelease --no-daemon

      - name: Name the APK
        run: cp apps/mobile/android/app/build/outputs/apk/release/app-release.apk "warden-test-${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: warden-test-${{ github.run_number }}
          path: warden-test-${{ github.run_number }}.apk
          retention-days: 14

      - name: Publish as a pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "test-build-${{ github.run_number }}" \
            "warden-test-${{ github.run_number }}.apk" \
            --prerelease \
            --target "${{ github.sha }}" \
            --title "Test build ${{ github.run_number }} (${GITHUB_REF_NAME})" \
            --notes "Test APK for Android phones, built from ${GITHUB_SHA::7}. It starts in demo mode with sample data until a server is set up. Signed with a development key: for testing only, not for the Play Store."
