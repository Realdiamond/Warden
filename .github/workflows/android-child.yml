name: Build monitored Android app

on:
  push:
    branches: [monitor]
    paths:
      - "android/child/**"
      - ".github/workflows/android-child.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android/child
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: monitor-child-debug-apk
          path: android/child/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
