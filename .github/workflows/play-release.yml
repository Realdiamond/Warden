name: Play Store release

# Builds Warden for the Google Play Store: an app bundle (.aab) to upload, plus two APKs for
# installing on phones directly during the pilot. All of them use the live server, start out of
# demo mode, and are signed with Warden's upload key (docs/play-store.md).
#
# Run it from the Actions tab. A pull request that changes this file or app.config.ts gets a
# practice run instead, signed with a throwaway key, so a broken release setup shows up in review
# rather than on launch day. Practice files can never be uploaded to the Play Store.

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "The version people see in the Play Store, like 1.0.0"
        required: true
        default: "1.0.0"
  pull_request:
    paths:
      - ".github/workflows/play-release.yml"
      - "apps/mobile/app.config.ts"

permissions:
  contents: read

concurrency:
  group: play-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bundle:
    name: Build the Play Store bundle
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PRACTICE: ${{ github.event_name == 'pull_request' }}
      WARDEN_API_URL: ${{ vars.WARDEN_API_URL }}
      WARDEN_BROADCAST_PUBLIC_KEY: ${{ vars.WARDEN_BROADCAST_PUBLIC_KEY }}
      WARDEN_VERSION_NAME: ${{ inputs.version_name || '0.0.0-practice' }}
      HAS_UPLOAD_KEY: ${{ secrets.WARDEN_UPLOAD_KEYSTORE_BASE64 != '' && secrets.WARDEN_UPLOAD_STORE_PASSWORD != '' }}
    steps:
      - name: Check the release settings
        if: env.PRACTICE != 'true'
        run: |
          problems=""
          [ "$HAS_UPLOAD_KEY" = "true" ] || problems="$problems\n- The upload key secrets are missing (docs/play-store.md, step 2)."
          [ -n "$WARDEN_API_URL" ] || problems="$problems\n- The WARDEN_API_URL variable is not set, so the app would start in demo mode."
          [ -n "$WARDEN_BROADCAST_PUBLIC_KEY" ] || problems="$problems\n- The WARDEN_BROADCAST_PUBLIC_KEY variable is not set, so phones could not check responder broadcasts."
          if [ -n "$problems" ]; then
            printf "Cannot build a Play Store release yet:%b\n" "$problems"
            exit 1
          fi

      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      - run: pnpm install --frozen-lockfile

      - name: Check the app's JavaScript
        working-directory: apps/mobile
        run: pnpm typecheck && pnpm test

      - name: Get the upload key
        env:
          KEYSTORE_BASE64: ${{ secrets.WARDEN_UPLOAD_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.WARDEN_UPLOAD_STORE_PASSWORD }}
        run: |
          key="$RUNNER_TEMP/warden-upload-key.p12"
          if [ "$PRACTICE" = "true" ]; then
            STORE_PASSWORD="practice-$(openssl rand -hex 16)"
            echo "::add-mask::$STORE_PASSWORD"
            keytool -genkeypair -noprompt -keystore "$key" -storetype PKCS12 \
              -storepass "$STORE_PASSWORD" -keypass "$STORE_PASSWORD" -alias warden-upload \
              -keyalg RSA -keysize 2048 -validity 2 -dname "CN=Warden practice, O=Warden, C=NG"
          else
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$key"
          fi
          {
            echo "WARDEN_UPLOAD_STORE_FILE=$key"
            echo "WARDEN_UPLOAD_STORE_PASSWORD=$STORE_PASSWORD"
            echo "WARDEN_UPLOAD_KEY_ALIAS=warden-upload"
          } >> "$GITHUB_ENV"

      - name: Generate the native Android project
        working-directory: apps/mobile
        env:
          CI: "1"
        run: |
          # Play version numbers start at 100000, above every test build.
          export WARDEN_VERSION_CODE=$((100000 + GITHUB_RUN_NUMBER))
          echo "WARDEN_VERSION_CODE=$WARDEN_VERSION_CODE" >> "$GITHUB_ENV"
          npx expo prebuild --platform android --no-install

      - name: Build the bundle and the APKs
        working-directory: apps/mobile/android
        env:
          ORG_GRADLE_PROJECT_reactNativeArchitectures: armeabi-v7a,arm64-v8a
        run: ./gradlew bundleRelease assembleRelease --no-daemon

      - name: Check they are signed with the upload key
        run: |
          aab=apps/mobile/android/app/build/outputs/bundle/release/app-release.aab
          signer=$(keytool -printcert -jarfile "$aab" | grep -m1 "Owner:")
          echo "Bundle signed by: $signer"
          case "$signer" in
            *"Android Debug"*) echo "The bundle is signed with the development key; Google Play would refuse it."; exit 1 ;;
            *Warden*) ;;
            *) echo "The bundle is not signed with Warden's upload key."; exit 1 ;;
          esac

      - name: Name the files
        run: |
          name="warden-${WARDEN_VERSION_NAME}-${WARDEN_VERSION_CODE}"
          out=apps/mobile/android/app/build/outputs
          mkdir -p release
          cp "$out/bundle/release/app-release.aab" "release/$name.aab"
          cp "$out/apk/release/app-arm64-v8a-release.apk" "release/$name-64bit.apk"
          cp "$out/apk/release/app-armeabi-v7a-release.apk" "release/$name-32bit.apk"
          ls -lh release
          echo "RELEASE_NAME=$name" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PRACTICE == 'true' && 'practice-only-' || '' }}${{ env.RELEASE_NAME }}
          path: release/
          retention-days: ${{ env.PRACTICE == 'true' && 3 || 30 }}

      - name: Remove the key from this machine
        if: always()
        run: rm -f "$RUNNER_TEMP/warden-upload-key.p12"
