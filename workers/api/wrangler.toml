name = "andsv-api"
main = "src/index.ts"
compatibility_date = "2024-11-01"

# Always re-bundle the latest built dashboard before any deploy, so `wrangler deploy` on its own
# can never ship a stale UI (build the dashboard first: pnpm --filter @andsv/dashboard build).
[build]
command = "node scripts/bundle-dashboard.mjs"

# D1 database binding. After `wrangler d1 create monitor`, paste the printed database_id here.
[[d1_databases]]
binding = "DB"
database_name = "monitor"
database_id = "30c71574-ee81-4b0b-ad1c-eeae7e17314a"

# The dashboard is bundled into the Worker script itself (see scripts/bundle-dashboard.mjs,
# run automatically by `pnpm deploy`), so there is no separate asset upload.

# Durable Object relay for live screen view + remote control (one instance per device).
[[durable_objects.bindings]]
name = "RELAY"
class_name = "StreamRelay"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["StreamRelay"]

# Secrets (set with `wrangler secret put`, never committed):
#   wrangler secret put ANDSV_JWT_SECRET
#   wrangler secret put ANDSV_ENCRYPTION_KEY   # 64 hex chars (32 bytes)
